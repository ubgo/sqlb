version: '3'

# Reusable command runner for the ubgo/sqlb contrib module driver-sqlite.
# The repository-wide gate is `task check` at the root, which walks this
# module too; these tasks are for working inside it.

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  test:
    desc: Run tests, including the conformance suite against a real database
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with the race detector
    cmds:
      - go test -race -count=2 ./...

  conformance:
    desc: Run only the shared conformance suite, verbosely
    cmds:
      - go test -run TestConformance -v ./...

  cover:
    desc: Run tests with coverage and print the total
    cmds:
      - go test -coverprofile=cover.out -covermode=atomic ./...
      - go tool cover -func=cover.out | tail -1

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  lint:
    desc: golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:check:
    desc: Fail if any file is not gofmt-clean
    cmds:
      - test -z "$(gofmt -l .)"

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy

  check:
    desc: Full local gate for this module
    cmds:
      - task: fmt:check
      - task: vet
      - task: test:race
