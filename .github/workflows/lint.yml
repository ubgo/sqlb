# Manual only, on purpose. ci.yml, generated by `volt gen`, already runs
# golangci-lint through `volt ci` on every push and pull request; this is the
# pinned-version run for the times a clean-machine check is wanted. See the
# note at the top of test.yml.

name: lint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golangci:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - contrib/driver-sqlite
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.0
          working-directory: ${{ matrix.module }}
          args: --timeout=5m
