# Manual only. Tagging is a decision, so it stays a button rather than a
# consequence of a merge.
#
# `task release:dryrun` prints what the next tag would be, and
# `task release:patch|minor|major` tags locally without pushing.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0. It must already exist and be pushed."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: assert the tag exists
        run: |
          if ! git rev-parse "refs/tags/${{ inputs.tag }}" >/dev/null 2>&1; then
            echo "tag ${{ inputs.tag }} does not exist; create and push it first"
            exit 1
          fi
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" --generate-notes --verify-tag
